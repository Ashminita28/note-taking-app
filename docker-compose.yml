services:
  postgres:
    image: postgres:16
    container_name: notetaking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notetaking
      POSTGRES_PASSWORD: notetaking
      POSTGRES_DB: notetaking_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notetaking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
